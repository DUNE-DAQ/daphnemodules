name: build-develop

# Controls when the action will run. Workflow runs when manually triggered using the UI
# or API.
on:
  push:
    branches: 
      - develop
      - patch/*
      - prep-release/*
      - johnfreeman/sandbox_target*
    paths-ignore:
      - 'docs/**'
      - '.github/**'
  pull_request:
    branches:
      - develop
      - prep-release/*
      - johnfreeman/sandbox_target3
  schedule:
    - cron: "0 9 * * *"

  workflow_dispatch:

jobs:
  build_develop_dispatch:
    name: Build against the development release
    uses: DUNE-DAQ/.github/.github/workflows/dunedaq-develop-cpp-ci.yml@johnfreeman/daq-release_issue485_correlated_branches_experiment
    with:
      caller_branch: ${{ github.head_ref || github.ref_name }}
      target_branch: ${{ github.base_ref || github.ref_name }}

