syntax = "proto3";

package daphne;

// Canonical low-level AFE/FPGA messages (request first, then explicit *_response)
// All requests keep int32 id = 1 for DAQ; responses mirror ZMQ style.

message cmd_writeAFEReg {
  int32  id         = 1;
  uint32 afeBlock   = 2;
  uint32 regAddress = 3;
  uint32 regValue   = 4;
}

message cmd_writeAFEReg_response {
  bool   success    = 1;
  string message    = 2;
  uint32 afeBlock   = 3;
  uint32 regAddress = 4;
  uint32 regValue   = 5;
}

message cmd_writeAFEVGAIN {
	int32  id         = 1;
	uint32 afeBlock   = 2;
	uint32 vgainValue = 3;
}

message cmd_writeAFEVGAIN_response {
  bool   success    = 1;
  string message    = 2;
  uint32 afeBlock   = 3;
  uint32 vgainValue = 4;
}

message cmd_writeAFEBiasSet {
	int32  id        = 1;
	uint32 afeBlock  = 2;
	uint32 biasValue = 3;
}

message cmd_writeAFEBiasSet_response {
  bool   success   = 1;
  string message   = 2;
  uint32 afeBlock  = 3;
  uint32 biasValue = 4;
}

message cmd_writeTRIM_allChannels {
	int32  id        = 1;
	uint32 trimValue = 2;
	bool   trimGain  = 3;
}

message cmd_writeTRIM_allChannels_response {
  bool   success   = 1;
  string message   = 2;
  uint32 trimValue = 3;
  bool   trimGain  = 4;
}

message cmd_writeTrim_allAFE {
	int32  id        = 1;
	uint32 afeBlock  = 2;
    uint32 trimValue = 3;
    bool   trimGain  = 4;
}

message cmd_writeTrim_allAFE_response {
  bool   success   = 1;
  string message   = 2;
  uint32 afeBlock  = 3;
  uint32 trimValue = 4;
  bool   trimGain  = 5;
}


message cmd_writeTrim_singleChannel {
	int32  id          = 1;
	uint32 trimChannel = 2;
	uint32 trimValue   = 3;
	bool   trimGain    = 4;
}

message cmd_writeTrim_singleChannel_response {
  bool   success     = 1;
  string message     = 2;
  uint32 trimChannel = 3;
  uint32 trimValue   = 4;
  bool   trimGain    = 5;
}

message cmd_writeOFFSET_allChannels {
	int32  id          = 1;
	uint32 offsetValue = 2;
	bool   offsetGain  = 3;
}

message cmd_writeOFFSET_allChannels_response {
  bool   success     = 1;
  string message     = 2;
  uint32 offsetValue = 3;
  bool   offsetGain  = 4;
}

message cmd_writeOFFSET_allAFE {
	int32  id          = 1;
	uint32 afeBlock    = 2;
	uint32 offsetValue = 3;
	bool   offsetGain  = 4;
}

message cmd_writeOFFSET_allAFE_response {
  bool   success     = 1;
  string message     = 2;
  uint32 afeBlock    = 3;
  uint32 offsetValue = 4;
  bool   offsetGain  = 5;
}

message cmd_writeOFFSET_singleChannel {
	int32  id              = 1;
	uint32 offsetChannel   = 2;
	uint32 offsetValue     = 3;
	bool   offsetGain      = 4;
}

message cmd_writeOFFSET_singleChannel_response {
  bool   success       = 1;
  string message       = 2;
  uint32 offsetChannel = 3;
  uint32 offsetValue   = 4;
  bool   offsetGain    = 5;
}

message cmd_writeVbiasControl {
	int32  id                = 1;
	uint32 vBiasControlValue = 2;
	bool   enable            = 3;
}

message cmd_writeVbiasControl_response {
  bool   success           = 1;
  string message           = 2;
  uint32 vBiasControlValue = 3;
}

message cmd_readAFEReg {
	int32 id = 1;
	uint32 afeBlock = 2;
	uint32 regAddress = 3;
}

message cmd_readAFEReg_response {
  bool   success = 1;
  string message = 2;
  uint32 afeBlock = 3;
  uint32 regAddress = 4;
  uint32 regValue = 5;
}

message cmd_readAFEVgain {
	int32 id = 1;
	uint32 afeBlock = 2;
}

message cmd_readAFEVgain_response {
  bool   success = 1;
  string message = 2;
  uint32 afeBlock = 3;
  uint32 vgainValue = 4;
}

message cmd_readAFEBiasSet {
	int32 id = 1;
	uint32 afeBlock = 2;
}

message cmd_readAFEBiasSet_response {
  bool   success = 1;
  string message = 2;
  uint32 afeBlock = 3;
  uint32 biasValue = 4;
}

message cmd_readTrim_allChannels {
	int32 id = 1;
}

message cmd_readTrim_allChannels_response {
  bool   success = 1;
  string message = 2;
  repeated uint32 trimValues = 3;
}

message cmd_readTrim_allAFE {
	int32 id = 1;
	uint32 afeBlock = 2;
}

message cmd_readTrim_allAFE_response {
  bool   success = 1;
  string message = 2;
  uint32 afeBlock = 3;
  repeated uint32 trimValues = 4;
}

message cmd_readTrim_singleChannel {
	int32 id = 1;
	uint32 trimChannel = 2;
}

message cmd_readTrim_singleChannel_response {
  bool   success = 1;
  string message = 2;
  uint32 trimChannel = 3;
  uint32 trimValue = 4;
}

message cmd_readOffset_allChannels {
	int32 id = 1;
}

message cmd_readOffset_allChannels_response {
  bool   success = 1;
  string message = 2;
  repeated uint32 offsetValues = 3;
}

message cmd_readOffset_allAFE {
	int32 id = 1;
	uint32 afeBlock = 2;
}

message cmd_readOffset_allAFE_response {
  bool   success = 1;
  string message = 2;
  uint32 afeBlock = 3;
  repeated uint32 offsetValues = 4;
}

message cmd_readOffset_singleChannel {
	int32 id = 1;
	uint32 offsetChannel = 2;
}

message cmd_readOffset_singleChannel_response {
  bool   success = 1;
  string message = 2;
  uint32 offsetChannel = 3;
  uint32 offsetValue = 4;
}

message cmd_readVbiasControl {
	int32 id = 1;
}

message cmd_readVbiasControl_response {
  bool   success = 1;
  string message = 2;
  uint32 vBiasControlValue = 3;
}

message cmd_readCurrentMonitor {
	int32 id = 1;
	uint32 currentMonitorChannel = 2;
}

message cmd_readCurrentMonitor_response {
  bool   success = 1;
  string message = 2;
  uint32 currentMonitorChannel = 3;
  uint32 currentValue = 4;
}

message cmd_readBiasVoltageMonitor {
	int32 id = 1;
	uint32 afeBlock = 2;
}

message cmd_readBiasVoltageMonitor_response {
  bool   success = 1;
  string message = 2;
  uint32 afeBlock = 3;
  uint32 biasVoltageValue = 4;
}

message cmd_cfgAFEReset {
	int32 id = 1;
	uint32 afeBlock = 2;
}

message cmd_cfgAFEPowerDown {
	int32 id = 1;
	uint32 afeBlock = 2;
	bool pwrState = 3;
}

message Status {
  bool success = 1;
  bytes extra  = 2;
}
